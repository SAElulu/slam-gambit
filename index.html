<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05050b">
<title>SLAM GAMBIT — Échecs × Basket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--txt:#f3f4ff;--mut:#98a0c0;--brd:rgba(255,255,255,.13);--c0:#ff5a1f;--c0b:#ffd23f;--c1:#1fb8ff;--c1b:#bff4ff;--S:60px;--hudH:88px;--barH:118px;--spin:0deg;--tilt:50deg}
html,body{margin:0;height:100%;background:#05050b;color:var(--txt);font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit}
/* ---------- arène ---------- */
#arena{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 70% at 50% 112%,#3a1250 0%,rgba(58,18,80,0) 58%),radial-gradient(90% 60% at 50% -12%,#0e2d55 0%,rgba(14,45,85,0) 65%),#05050b}
#arena .crowd{position:absolute;inset:-6%;background-image:radial-gradient(circle,rgba(255,255,255,.22) 0 1.3px,transparent 2px),radial-gradient(circle,rgba(255,150,90,.18) 0 1.2px,transparent 2px),radial-gradient(circle,rgba(120,200,255,.16) 0 1.1px,transparent 2px);background-size:13px 13px,21px 19px,17px 23px;background-position:0 0,6px 9px,3px 4px;-webkit-mask-image:radial-gradient(64% 52% at 50% 52%,transparent 50%,#000 82%);mask-image:radial-gradient(64% 52% at 50% 52%,transparent 50%,#000 82%);opacity:.6;animation:crowd 2.4s steps(2) infinite}
#arena.hype .crowd{animation-duration:.25s;opacity:.95}
@keyframes crowd{50%{background-position:1px 1px,7px 8px,2px 5px}}
.beam{position:absolute;top:-30%;width:46vmax;height:150vmax;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0) 72%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:50% 0;filter:blur(6px);mix-blend-mode:screen;animation:sweep 10s ease-in-out infinite alternate}
.beam.b1{left:-8%;--a:-28deg;--b:8deg}.beam.b2{right:-8%;--a:28deg;--b:-8deg;animation-duration:12.5s}
.beam.b3{left:30%;--a:-10deg;--b:12deg;animation-duration:15s;background:linear-gradient(180deg,rgba(255,90,220,.10),transparent 70%)}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
/* ---------- scène 3D ---------- */
#stage{position:absolute;left:0;right:0;top:var(--hudH);bottom:var(--barH);perspective:var(--persp,1100px);perspective-origin:50% 30%;touch-action:none;z-index:2}
#cam{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transform:translate(-50%,-50%) translateY(var(--camY,0px)) rotateX(var(--tilt)) rotateZ(var(--spin)) scale(var(--zoom,1));transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#cam.drag,#cam.drag .bb3,#cam.drag .fig,#cam.drag #ballb,#cam.drag .pct{transition:none!important}
#cam.shake{animation:shake .5s}
@keyframes shake{20%{translate:-6px 4px}40%{translate:6px -3px}60%{translate:-4px -2px}80%{translate:3px 3px}}
#board{position:relative;transform-style:preserve-3d}
.bb3{transform:rotateZ(calc(var(--spin)*-1)) rotateX(calc(var(--tilt)*-1));transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#slab{position:absolute;border-radius:calc(var(--S)*.3);background:linear-gradient(160deg,#171b2c,#0a0c16);box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 calc(var(--S)*1.6) rgba(0,0,0,.7);transform:translateZ(-3px)}
#glow{position:absolute;border-radius:50%;transform:translateZ(-6px);background:radial-gradient(closest-side,color-mix(in srgb,var(--c0) 30%,transparent),transparent 70%),radial-gradient(closest-side,color-mix(in srgb,var(--c1) 22%,transparent),transparent 80%);filter:blur(10px);opacity:.75}
.side{position:absolute;background:linear-gradient(180deg,#2a2f45,#0b0d16)}
.cell{position:absolute;width:var(--S);height:var(--S);background-image:repeating-linear-gradient(90deg,rgba(80,40,0,.13) 0 1px,transparent 1px calc(var(--S)/4.5)),linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.07));cursor:pointer}
.cell .hl{position:absolute;inset:0;pointer-events:none;transition:background .2s,box-shadow .2s}
.cell.mv .hl{background:radial-gradient(circle,rgba(110,240,255,.95) 0 11%,rgba(110,240,255,.35) 12% 30%,rgba(60,200,255,.12) 31%);box-shadow:inset 0 0 0 2px rgba(110,240,255,.55);animation:mvp 1.4s ease-in-out infinite}
.cell.mv:hover .hl{background:radial-gradient(circle,#fff 0 13%,rgba(110,240,255,.6) 14% 40%,rgba(60,200,255,.25) 41%)}
.cell.mv.hot .hl{box-shadow:inset 0 0 0 2px rgba(255,210,80,.8)}
@keyframes mvp{50%{box-shadow:inset 0 0 0 3px rgba(110,240,255,.9)}}
.cell.alt .hl{background:rgba(255,80,200,.35);box-shadow:inset 0 0 0 2px #ff70d0}
.cell .heat{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:0;transition:opacity .3s}
.cell.hm .heat{opacity:.7}
.pct{position:absolute;width:0;height:0;pointer-events:none;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.pct b{position:absolute;left:0;bottom:0;transform:translate(-50%,-10%);font:800 calc(var(--S)*.2)/1 'Outfit';color:#fff;background:rgba(10,10,20,.82);padding:.25em .45em;border-radius:99px;white-space:nowrap;border:1px solid rgba(255,255,255,.25);display:none}
.pct b.g{color:#7dffb0}.pct b.y{color:#ffe27a}.pct b.r{color:#ff8a8a}
.pct.on b{display:block}
#floor{position:absolute;left:0;top:0}
svg.court{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.lanes{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
/* paniers */
.hoop{position:absolute;left:0;top:0;transform-style:preserve-3d;pointer-events:none}
.hoop>*{position:absolute}
.board3{transform-origin:50% 100%;border:calc(var(--S)*.04) solid rgba(255,255,255,.95);border-radius:calc(var(--S)*.06);background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(190,230,255,.08));box-shadow:0 0 calc(var(--S)*.3) var(--hc),inset 0 0 calc(var(--S)*.2) rgba(255,255,255,.2)}
.board3::after{content:'';position:absolute;left:33%;width:34%;bottom:8%;height:42%;border:calc(var(--S)*.035) solid #fff;border-bottom:0}
.board3 i{position:absolute;left:0;right:0;top:-38%;text-align:center;font:400 calc(var(--S)*.24)/1 'Orbitron',monospace;color:#ff4040;text-shadow:0 0 8px #f00}
.pole3{transform-origin:50% 100%;background:linear-gradient(90deg,#20232e,#6a7088,#20232e);border-radius:4px}
.rim3{border-radius:50%;border:calc(var(--S)*.05) solid #ff6a1a;box-shadow:0 0 12px #ff6a1a,inset 0 0 6px #ff6a1a}
.rim3.wob{animation:wob .45s}
@keyframes wob{30%{border-color:#fff}50%{scale:1.12}}
.net3{transform-origin:50% 0}
.net3 svg{width:100%;height:100%;overflow:visible}
.net3.sw svg{animation:swish .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes swish{30%{transform:scaleY(1.35) scaleX(.85)}}
/* pièces */
.pc{position:absolute;left:0;top:0;width:var(--S);height:var(--S);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.25,.5,1);pointer-events:none}
.pc .disc{position:absolute;inset:13%;border-radius:50%;transform:translateZ(2px);pointer-events:auto;cursor:pointer;background:radial-gradient(circle at 50% 40%,var(--tc2),var(--tc) 55%,rgba(0,0,0,.55));box-shadow:0 0 0 calc(var(--S)*.035) rgba(255,255,255,.75),0 0 calc(var(--S)*.32) var(--tc);transition:box-shadow .2s}
.pc .fig{position:absolute;left:50%;bottom:42%;width:calc(var(--S)*.88);height:calc(var(--S)*1.36);margin-left:calc(var(--S)*-.44);transform-origin:50% 100%;pointer-events:auto;cursor:pointer;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .25s}
.pc .bob{position:absolute;inset:0;transform-origin:50% 100%}
.pc .bob svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 calc(var(--S)*.05) calc(var(--S)*.06) rgba(0,0,0,.55))}
.pc.t0{--tc:var(--c0);--tc2:var(--c0b)}.pc.t1{--tc:var(--c1);--tc2:var(--c1b)}
.pc.can .bob{animation:idle 2.2s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-4%)}}
.pc.sel .disc{box-shadow:0 0 0 calc(var(--S)*.06) #fff,0 0 calc(var(--S)*.6) var(--tc),0 0 calc(var(--S)*.25) #fff;animation:selp .9s ease-in-out infinite}
@keyframes selp{50%{box-shadow:0 0 0 calc(var(--S)*.09) #fff,0 0 calc(var(--S)*.9) var(--tc),0 0 calc(var(--S)*.3) #fff}}
.pc.sel .bob{animation:none;transform:translateY(-10%) scale(1.06)}
.pc.pass .disc{box-shadow:0 0 0 calc(var(--S)*.06) #ffe14a,0 0 calc(var(--S)*.6) #ffd000;animation:passp 1s infinite}
.pc.lob .disc{box-shadow:0 0 0 calc(var(--S)*.06) #d48cff,0 0 calc(var(--S)*.6) #b44dff;animation:passp 1s infinite}
@keyframes passp{50%{filter:brightness(1.5)}}
.pc.steal .disc{box-shadow:0 0 0 calc(var(--S)*.07) #ff3355,0 0 calc(var(--S)*.8) #ff0033;animation:passp .6s infinite}
.pc.ghost .fig{opacity:.32;pointer-events:none}
.pc.ghost .disc{pointer-events:none}
.pc.stun .bob{animation:dizzy 1.2s ease-in-out infinite}
@keyframes dizzy{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.pc .stars{position:absolute;left:0;bottom:calc(var(--S)*1.3);width:calc(var(--S)*.62);height:calc(var(--S)*.32);transform:translateX(-50%);display:none;animation:spinst 1.4s linear infinite;pointer-events:none}
.pc .stars svg{display:block}
.pc.stun .stars{display:block}
@keyframes spinst{50%{transform:translateX(-50%) scaleX(-1)}}
.pc.hop .bob{animation:hop .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes hop{40%{transform:translateY(-55%) scale(1.05)}}
.pc.dunk .bob{animation:dunkj .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes dunkj{45%{transform:translateY(-95%) rotate(-6deg) scale(1.1)}}
.pc.lunge .bob{animation:lunge .5s}
@keyframes lunge{40%{transform:scale(1.18) rotate(-10deg)}}
.pc .tag{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);font:900 calc(var(--S)*.15)/1 'Outfit';letter-spacing:.06em;background:rgba(5,6,14,.85);color:#fff;padding:.18em .4em;border-radius:99px;border:1px solid var(--tc);white-space:nowrap;opacity:0;transition:opacity .2s}
.pc.sel .tag,.pc:hover .tag,body.tags .pc .tag{opacity:1}
#board.fire0 .pc.t0 .disc,#board.fire1 .pc.t1 .disc{animation:firep .5s ease-in-out infinite alternate}
@keyframes firep{to{box-shadow:0 0 0 calc(var(--S)*.04) #ffd23f,0 0 calc(var(--S)*.7) #ff4d00}}
/* ballon */
#ballw{position:absolute;left:0;top:0;width:var(--S);height:var(--S);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.25,.5,1);pointer-events:none}
#ballw.fly{transition:none}
#ballb{position:absolute;left:50%;bottom:50%;width:calc(var(--S)*.32);height:calc(var(--S)*.32);margin-left:calc(var(--S)*-.16);transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#ballb .off{position:absolute;inset:0;transform:translate(calc(var(--S)*.34),calc(var(--S)*-.42));transition:transform .25s}
#ballw.fly #ballb .off{transform:translate(0,50%)}
#ball{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffc08a 0,#f47318 38%,#c24b08 72%,#7a2a02 100%);box-shadow:0 0 calc(var(--S)*.25) rgba(255,120,30,.75);animation:dribble .52s cubic-bezier(.45,0,.55,1) infinite alternate;overflow:hidden}
#ball svg{position:absolute;inset:0;width:100%;height:100%}
#ballw.fly #ball{animation:bspin .5s linear infinite}
#ballw.fire #ball{box-shadow:0 0 calc(var(--S)*.25) #ffcc00,0 0 calc(var(--S)*.6) #ff3d00}
#ballw.hide{opacity:0}
@keyframes dribble{to{transform:translateY(calc(var(--S)*.36)) scaleY(.92)}}
@keyframes bspin{to{transform:rotate(360deg)}}
#bshadow{position:absolute;left:0;top:0;width:calc(var(--S)*.36);height:calc(var(--S)*.36);border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);pointer-events:none;opacity:0}
#bshadow.on{opacity:1}
/* ---------- FX ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
#big{position:fixed;left:50%;top:44%;z-index:31;pointer-events:none;text-align:center;opacity:0;transform:translate(-50%,-50%)}
#big .t{font:400 min(17vw,132px)/.9 'Anton',Impact,sans-serif;letter-spacing:.02em;background:linear-gradient(180deg,#fff 10%,#ffe08a 45%,#ff7a1a 80%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #8a2600) drop-shadow(0 4px 0 #561700) drop-shadow(0 14px 22px rgba(0,0,0,.7));white-space:nowrap}
#big .s{font:800 min(5vw,26px)/1.2 'Outfit';letter-spacing:.2em;text-transform:uppercase;margin-top:8px;text-shadow:0 2px 10px #000}
#big.cool .t{background:linear-gradient(180deg,#fff 10%,#a5f0ff 50%,#1f8bff 90%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #0b3a7a) drop-shadow(0 4px 0 #082650) drop-shadow(0 14px 22px rgba(0,0,0,.7))}
#big.bad .t{background:linear-gradient(180deg,#fff 10%,#ffb3c1 45%,#ff2e55 85%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #6b0018) drop-shadow(0 4px 0 #43000f) drop-shadow(0 14px 22px rgba(0,0,0,.7))}
#big.show{animation:bigpop 1.5s cubic-bezier(.2,1.3,.3,1) forwards}
#big.small .t{font-size:min(10vw,72px)}
@keyframes bigpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-10deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-3deg)}26%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}78%{opacity:1;transform:translate(-50%,-50%) scale(1.04) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-90%) scale(1.25) rotate(-3deg)}}
#flash{position:fixed;inset:0;z-index:29;pointer-events:none;background:radial-gradient(circle,rgba(255,200,120,.35),transparent 60%);opacity:0}
#flash.on{animation:flash .6s}
@keyframes flash{15%{opacity:1}}
/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;height:var(--hudH);z-index:20;display:flex;justify-content:center;align-items:center;padding:max(6px,env(safe-area-inset-top)) 8px 4px;pointer-events:none}
.sb{pointer-events:auto;display:flex;align-items:stretch;background:linear-gradient(180deg,rgba(28,31,52,.92),rgba(9,10,20,.92));border:1px solid var(--brd);border-radius:20px;box-shadow:0 14px 36px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1);overflow:hidden;position:relative}
.sb::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c0) 30%,transparent),transparent 30%,transparent 70%,color-mix(in srgb,var(--c1) 30%,transparent));pointer-events:none}
.tm{position:relative;display:flex;align-items:center;gap:10px;padding:6px 14px;min-width:120px}
.tm.t1{flex-direction:row-reverse;text-align:right}
.tm .nm{display:flex;flex-direction:column;gap:2px}
.tm .nm b{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tm .nm small{font-size:11px;color:var(--mut);white-space:nowrap}
.tm .sc{font:400 44px/1 'Anton',Impact,sans-serif;min-width:1.2em;text-align:center;transition:transform .3s}
.tm.t0 .sc{color:var(--c0b);text-shadow:0 0 18px var(--c0)}.tm.t1 .sc{color:var(--c1b);text-shadow:0 0 18px var(--c1)}
.tm .sc.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.5)}}
.tm .pos{position:absolute;bottom:4px;width:9px;height:9px;border-radius:50%;background:#ff7a1a;box-shadow:0 0 10px #ff7a1a;opacity:0;transition:opacity .3s}
.tm.t0 .pos{right:8px}.tm.t1 .pos{left:8px}
.tm.has .pos{opacity:1}
.tm .fire{position:absolute;top:2px;font-size:14px;display:none;animation:firej .4s infinite alternate}
.tm.t0 .fire{right:6px}.tm.t1 .fire{left:6px}
.tm.onfire .fire{display:block}
@keyframes firej{to{transform:translateY(-2px) scale(1.15)}}
.tm.turn::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px;background:var(--tc);box-shadow:0 0 12px var(--tc)}
.tm.t0{--tc:var(--c0)}.tm.t1{--tc:var(--c1)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 12px;background:rgba(0,0,0,.55);border-left:1px solid var(--brd);border-right:1px solid var(--brd);min-width:84px}
.clk{font:900 30px/1 'Orbitron',monospace;color:#ff3b3b;text-shadow:0 0 10px #ff0000,0 0 22px rgba(255,0,0,.5)}
.clk.low{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.mid small{font-size:10px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-top:3px;white-space:nowrap}
#check{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);font:900 11px/1 'Outfit';letter-spacing:.2em;padding:5px 10px;border-radius:99px;background:#ff2e55;color:#fff;box-shadow:0 0 18px #ff2e55;display:none;white-space:nowrap}
#check.on{display:block;animation:passp .7s infinite}
/* bulles */
.bub{position:fixed;z-index:40;pointer-events:none;padding:8px 12px;border-radius:16px;font-weight:800;font-size:15px;background:#fff;color:#111;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:bub 2.6s forwards;white-space:nowrap}
.bub.e{font-size:34px;background:none;box-shadow:none;padding:0}
@keyframes bub{0%{opacity:0;transform:translateY(10px) scale(.6)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
/* outils */
#tools{position:fixed;right:max(8px,env(safe-area-inset-right));top:calc(var(--hudH) + 8px);z-index:21;display:flex;flex-direction:column;gap:8px}
.tb{width:42px;height:42px;border-radius:14px;background:rgba(18,20,36,.78);border:1px solid var(--brd);display:grid;place-items:center;font-size:18px;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .15s,background .2s}
.tb:active{transform:scale(.9)}
.tb.on{background:rgba(255,120,40,.35);border-color:#ff9a4a}
#emopop{position:fixed;right:58px;top:calc(var(--hudH) + 8px);z-index:22;display:none;gap:4px;padding:6px;border-radius:16px;background:rgba(18,20,36,.92);border:1px solid var(--brd);flex-wrap:wrap;width:196px}
#emopop.on{display:flex}
#emopop button{font-size:24px;width:42px;height:42px;border-radius:10px}
#emopop button:hover{background:rgba(255,255,255,.1)}
/* ---------- barre d'action ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--barH);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:0 8px max(10px,env(safe-area-inset-bottom));pointer-events:none}
#info{pointer-events:auto;max-width:min(560px,96vw);display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:99px;background:rgba(14,16,30,.82);border:1px solid var(--brd);font-size:13px;color:#dfe3ff;box-shadow:0 8px 24px rgba(0,0,0,.4);min-height:38px}
#info .ph{display:flex;gap:5px}
#info .pip{font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:#8e95b5;white-space:nowrap}
#info .pip.on{background:linear-gradient(135deg,#29d3ff,#3a7bff);color:#fff;box-shadow:0 0 12px rgba(41,211,255,.5)}
#info .pip.ac.on{background:linear-gradient(135deg,#ffb02e,#ff5a1f);box-shadow:0 0 12px rgba(255,90,31,.5)}
#info .tx{line-height:1.25}
#info .tx b{color:#fff}
#acts{pointer-events:auto;display:flex;gap:8px;align-items:stretch}
.ab{position:relative;height:50px;padding:0 16px;border-radius:16px;font-weight:900;font-size:14px;letter-spacing:.05em;display:flex;align-items:center;gap:8px;background:rgba(22,24,42,.9);border:1px solid var(--brd);box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .12s,filter .2s,opacity .2s;white-space:nowrap}
.ab:active{transform:scale(.94)}
.ab:disabled{opacity:.35;filter:grayscale(.8);pointer-events:none}

function stunned(S,p){return p.stun>=S.turnNo}
function canMove(S){return !S.used||S.extra>0}

/* Remise en jeu : l'attaque se replace dans sa moitié, la défense devant son panier */
function formation(S,off,ev,why){const def=1-off;

function newGame(o){
 const S={v:3,target:o.target||11,skins:[o.skin0,o.skin1],sys:[o.sys0||null,o.sys1||null],
  pieces:[],ball:0,poss:0,turn:0,turnNo:1,clock:CLOCK,used:false,extra:0,
  score:[0,0],hands:[[],[]],buf:{hot:[0,0],box:[0,0],dbl:[0,0]},streak:[0,0],fire:[0,0],
  st:[],lastPass:null,winner:null,fouls:[0,0],pendFT:null,mgOn:o.mg!==false};

/* Motif de déplacement d'une pièce (comme aux échecs). fn(c,r,q) : q = pièce qui bloque la case (ou null) */
function pattern(S,p,fn){

 const jump=os=>{for(const[dc,dr]of os){const c=p.c+dc,r=p.r+dr;if(inB(c,r))fn(c,r,pAt(S,c,r))}};
 switch(p.role){case'PG':slide(D8,2);break;case'SG':jump(KN);slide(D4,1);break;case'SF':slide(DG,2);slide(D4,1);break;case'PF':slide(D4,3);break;case'C':slide(D8,1);slide(D4,2);break}

function moveTargets(S,p){const out=[],seen=new Set();

/* p « attaque » la case de q (prise possible, comme aux échecs) */
function attacks(S,p,q){let hit=false;pattern(S,p,(c,r,x)=>{if(x&&x.id===q.id)hit=true});return hit}
/* une case vide serait-elle attaquée par l'équipe D si le porteur s'y trouvait ? */
function attackedSq(S,D,c,r){const fake={id:-1,c,r};const S2={pieces:S.pieces.map(x=>x)};

/* Un défenseur gêne le tir s'il est collé au tireur ET devant lui ou à sa hauteur (pas dans son dos) */
function contests(q,t,c,r){return q.t!==t&&Math.max(Math.abs(q.c-c),Math.abs(q.r-r))===1&&nrow(t,q.r)<=nrow(t,r)}
/* Seul le meilleur défenseur collé compte (pas de cumul) */
function contestOf(S,t,c,r,z,big){let con=0;const dsys=S.sys[1-t],ins=z==='rim'||z==='paint';
 for(const q of S.pieces){if(!contests(q,t,c,r)||stunned(S,q))continue;
  let v=q.role==='C'?(ins?25:18):(big&&ins&&q.role!=='PF'?6:12);
  con=Math.max(con,v+(dsys==='muraille'?4:0))}

/* Défense individuelle : chaque défenseur a un vis-à-vis (même numéro). À plus de 2 cases, l'attaquant est DÉMARQUÉ */

 const type=z==='rim'?((p.role==='C'||p.role==='PF')?'dunk':'layup'):z==='paint'?'hook':z==='mid'?'jump':z;
 if(z==='rim'&&sys==='showtime')base+=6;if(z==='three'&&sys==='snipers')base+=8;
 const con=z==='logo'?0:contestOf(S,t,c,r,z,p.role==='C'||p.role==='PF');base-=con;
 const cs=catchShoot(S,id);if(cs&&z!=='logo')base+=6;
 const op=z!=='logo'&&isOpen(S,p,c,r);if(op)base+=OPEN;
 if(S.fire[t])base+=10;if(S.buf.hot[t])base+=20;if(p.star)base+=6;
 return{p:clamp(base,2,95)/100,pts,type,zone:z,con:con/100,base:SHOT[p.role][z],cs,open:op}}
function catchShoot(S,id){const lp=S.lastPass;return!!(lp&&lp.to===id&&S.ball===id&&S.turnNo-lp.turnNo<=2)}
function alleyOK(S,q){if(q.t!==S.turn||q.id===S.ball)return false;const z=zoneOf(q.t,q.c,q.r);return z==='rim'||z==='paint'}
function alleyInfo(S,id){const i=shotInfo(S,id),t=S.pieces[id].t;return{p:clamp(.80-i.con*.5+(S.fire[t]?.1:0)+(S.buf.hot[t]?.2:0),.05,.95),pts:2,type:'alley',zone:i.zone,con:i.con}}

/* Passes : en ligne droite et chemin libre (le Meneur peut lober). Chaque défenseur qui
   rôde près de la trajectoire ou colle le receveur augmente le risque d'interception. */
function passOptions(S){const car=S.pieces[S.ball],out=[],T=car.t;
 for(const q of S.pieces){if(q.t!==T||q.id===car.id)continue;
  const dc=q.c-car.c,dr=q.r-car.r,line=dc===0||dr===0||Math.abs(dc)===Math.abs(dr),dist=Math.max(Math.abs(dc),Math.abs(dr));

  if(line){const sc=Math.sign(dc),sr=Math.sign(dr);for(let k=1;k<dist;k++){const c=car.c+sc*k,r=car.r+sr*k;path.push([c,r]);if(pAt(S,c,r))blocked=true}}
  let lob=false;
  if(blocked){if(dist<=4)lob=true;else{out.push({to:q.id,blocked:true,line});continue}}
  const lane=new Set(),mark=new Set();
  for(const d of S.pieces){if(d.t===T)continue;
   if(cheb(d,q)===1)mark.add(d.id);
   else if(!lob&&path.some(([c,r])=>Math.max(Math.abs(d.c-c),Math.abs(d.r-r))===1))lane.add(d.id)}
  let risk=lane.size*10+mark.size*12+Math.max(0,dist-3)*4+(lob?(S.sys[T]==='showtime'?10:18)+(car.role==='PG'?0:10):0);

/* Prise de balle : un défenseur dont le motif « attaque » le porteur peut tenter de lui prendre la balle */
function stealInfo(S,id){const d=S.pieces[id];if(!d||d.t===S.poss||stunned(S,d))return null;const car=S.pieces[S.ball];

 for(const q of S.pieces)if(q.t===d.t&&q.id!==d.id&&!stunned(S,q)&&attacks(S,q,car))o++;
 p+=12*Math.min(o,2);if(d.role==='PG'||d.role==='SG')p+=8;if(car.role==='PG')p-=10;if(S.sys[d.t]==='muraille')p+=10;if(S.buf.dbl[d.t])p+=25;

/* Crossover : le porteur « prend » un défenseur sur son motif et le dépasse */
function crossInfo(S,id){const car=S.pieces[S.ball],d=S.pieces[id];if(!d||!car||d.t===car.t||S.poss!==car.t||stunned(S,car))return null;
 if(!attacks(S,car,d))return null;let p=CROSS[car.role];if(car.star)p+=8;if(d.role==='C')p-=10;if(stunned(S,d))p+=20;
 let h=0;for(const q of S.pieces)if(q.t===d.t&&q.id!==d.id&&!stunned(S,q)&&cheb(q,d)===1)h++;p-=8*Math.min(h,2);

function hasCoup(S){const T=S.turn;if(S.pendFT||S.poss===T)return true;

function nearestTo(S,team,c,r,prefer){let best=null,bd=1e9;

function rebCands(S,T){const hr=rimRow(T);let cs=[];
 for(const q of S.pieces)if(Math.abs(q.c-3)<=2&&Math.abs(q.r-hr)<=2){let w={C:3,PF:2.2,SF:1.4,PG:1,SG:1}[q.role];if(q.t!==T)w*=1.35;if(S.sys[q.t]==='grit')w*=1.6;if(stunned(S,q))w*=.5;cs.push({q,w})}

function rebOdds(S,T){const cs=rebCands(S,T);if(!cs.length){const n=nearestTo(S,null,3,rimRow(T),1-T);return n.t===T?1:0}

/* Règle des 3 secondes : un défenseur ne peut pas rester 3 tours dans sa raquette sans coller un attaquant */
function check3s(S,ev,D){const A=S.poss;let viol=null;

  const g=S.pieces.some(q=>q.t===A&&cheb(q,p)===1);
  p.d3=(z==='rim'||z==='paint')&&!g?(p.d3||0)+1:0;if(p.d3>=D3&&!viol)viol=p}
 if(viol){const from=[viol.c,viol.r];let to=null,bd=1e9;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(pAt(S,c,r))continue;const z=zoneOf(A,c,r);if(z==='rim'||z==='paint')continue;const d=Math.hypot(c-viol.c,r-viol.r);if(d<bd){bd=d;to=[c,r]}}

function endTurn(S,ev,skip){const T=S.turn;
 if(!skip&&S.poss===T){S.clock--;if(S.clock<=0){ev.push({k:'viol',team:T});formation(S,1-T,ev,'viol')}}
 else if(!skip&&S.poss!==T&&S.winner==null)check3s(S,ev,T);

function doShot(S,ev,R,o,x){

function apply(S0,a,o){o=o||{};if(!S0||S0.winner!=null||!a)return null;

  for(let i=0;i<P.n;i++){const sv=S.mgOn&&a.mg&&a.mg[i]!=null?clamp(+a.mg[i],0,1):null;const fp=clamp((sv!=null?.45+.5*sv:.75)+(S.fire[T]?.08:0),.05,.98);m.push(F.ft!=null?F.ft:R()<fp)}

  else{const rc=S.pieces[a.to];let cand=op.thr.map(i=>S.pieces[i]);if(!cand.length)cand=S.pieces.filter(q=>q.t!==T);
   let n=cand[0],bd=1e9;for(const q of cand){const d=Math.hypot(q.c-rc.c,q.r-rc.r)+(op.lob?0:Math.hypot(q.c-(car.c+rc.c)/2,q.r-(car.r+rc.r)/2)*.5);if(d<bd){bd=d;n=q}}
   S.ball=n.id;S.poss=1-T;S.clock=CLOCK;S.st[n.id].stl++;S.lastPass=null;ev.push({k:'pass',from:car.id,to:a.to,lob:op.lob,int:n.id,p:op.p});endTurn(S,ev,true)}

  if(ok){const from=[d.c,d.r],to=[car.c,car.r];d.c=to[0];d.r=to[1];car.c=from[0];car.r=from[1];

  else{const foul=F.ok!=null?false:R()<.2;ev.push({k:'steal',id:d.id,tg:car.id,ok:false,foul,p:pp});

 const P=$('#pRules');P.innerHTML=`<button class="x" data-x>✕</button><h2>Règles</h2><p>Un échiquier en forme de terrain de basket. Chaque joueur bouge comme une pièce d'échecs. On marque des paniers ; le premier au score visé gagne.</p>

/* ---------- liens & réseau ---------- */
function baseURL(){return location.href.split('#')[0]}
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const s=atob(str),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function encodeGame(o){let b=new TextEncoder().encode(JSON.stringify(o));if(window.CompressionStream){try{const cs=new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'));return'z'+b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}catch(e){}}return'r'+b64u(b)}
async function decodeGame(str){let b=unb64u(str.slice(1));if(str[0]==='z'){const ds=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));b=new Uint8Array(await new Response(ds).arrayBuffer())}return JSON.parse(new TextDecoder().decode(b))}
function copyText(t,btn){const done=()=>{toast('Copié ✅');if(btn){btn.textContent='✓';setTimeout(()=>btn.textContent='Copier',1500)}};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));else fallbackCopy(t,done)}
function fallbackCopy(t,done){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Sélectionne le lien et copie-le')}a.remove()}
function shareText(url,txt){if(navigator.share)navigator.share({title:'SLAM GAMBIT',text:txt,url}).catch(()=>{});else copyText(url)}
async function showSend(force){const S=G.S;if(!S)return;const code=await encodeGame({p:G.corrStart||S,s:S,e:G.corrEv});const link=baseURL()+'#g='+code;

 P.innerHTML=`<h2>${fin?'Match terminé ! 🏁':'À ton ami ! 📤'}</h2><p>${fin?'Envoie-lui le lien pour qu\'il voie la fin du match.':'Envoie ce lien à ton ami (WhatsApp, SMS, Discord…). Il verra ton tour rejoué en 3D, puis jouera le sien et te renverra un lien.'}</p>

 ${location.protocol==='file:'?'<p class="note">Tu joues depuis le fichier sur ton appareil : ton ami doit avoir le fichier SLAM GAMBIT lui aussi. Il fait « Rejoindre » et colle ce lien en entier.</p>':''}
 <button class="big-btn ghost" data-cl>VOIR LE TERRAIN</button>`;
 openOv('ovSend');P.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cp!==undefined)copyText(link,b);else if(b.dataset.sh!==undefined)shareText(link,'🏀♛ À toi de jouer sur SLAM GAMBIT !');else if(b.dataset.cl!==undefined)closeAll();else if(b.dataset.pg!==undefined)handleJoin(parseJoin($('#pIn').value))}}

 const tryOne=()=>{if(i>=srcs.length)return rej(new Error('peerjs'));const s=document.createElement('script');s.src=srcs[i++];s.onload=()=>window.Peer?res():tryOne();s.onerror=tryOne;document.head.appendChild(s)};tryOne();setTimeout(()=>rej(new Error('timeout')),15000)})}

 if(state==='fail'||state==='nf')h+=`<p>${state==='fail'?'Le serveur temps réel est injoignable (pas d\'internet, pare-feu ou bloqueur ?).':'Vérifie le code, ou demande à ton ami de recréer une salle.'}</p><button class="big-btn alt" data-corr>JOUER PAR LIEN À LA PLACE ✉️</button>`;

async function hostLive(){netClose();const code=rcode();G.net={role:'host',code};renderOnline('wait');
 try{await loadPeer()}catch(e){if(G.net&&G.net.code===code)renderOnline('fail');return}
 if(!G.net||G.net.code!==code)return;
 const peer=new Peer(PFX+code,{debug:0});G.net.peer=peer;
 peer.on('open',()=>{if(G.net&&G.net.peer===peer&&G.mode!=='live')renderOnline('ready')});
 peer.on('connection',c=>{if(G.net.conn&&G.net.conn.open){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300)});return}G.net.conn=c;wireConn(c)});
 peer.on('error',e=>{if(!G.net||G.net.peer!==peer)return;if(e.type==='unavailable-id'){peer.destroy();hostLive()}else if(['network','server-error','socket-error','browser-incompatible','ssl-unavailable'].includes(e.type)){if(G.mode!=='live')renderOnline('fail')}});

 setTimeout(()=>{if(G.net&&G.net.peer===peer&&G.mode!=='live'&&!(G.net.conn&&G.net.conn.open))renderOnline('nf')},20000)}

 mate1:{t:'Mat en 1',ic:'♛',s:'Trouve l\'échec et mat : touche une pièce blanche, puis sa case.',time:15000},

const MG_POOL={steal:['mate1','mate2','fork','reflex','memo','mate1'],cross:['combo','mate1','meter','memo','combo'],protect:['mash','reflex','combo'],ft:['meter'],alley:['meter']};

function miniPlay(kind,o){o=o||{};
 if(window.__mgAuto!=null){const v=window.__mgAuto;return Promise.resolve(o.rounds?Array(o.rounds).fill(v):v)}
 return new Promise(res=>{const K=MGK[kind],ov=$('#mg'),time=(o.time||K.time)*(o.rounds||1);
  ov.innerHTML=`<div class="mgp" style="--mc:${o.col||'#ff7a1a'}"><div class="mgh"><span class="mgi">${K.ic}</span><div class="mgtt"><small>${o.ctx||'MINI-JEU'}</small><b>${K.t}</b></div>${o.prize?`<div class="mgbon">${o.prize}</div>`:''}</div>
   <p class="mgs">${o.sub||K.s}</p><div class="mgtm"><i></i></div><div class="mgb"></div><div class="mgr"></div></div>`;
  ov.classList.add('on');sfx('mgstart');
  const body=ov.querySelector('.mgb'),bar=ov.querySelector('.mgtm i');let done=false,t0=0,raf=0,started=false;const cleanup=[];
  const api={body,o,started:()=>started,
   timeLeft:()=>started?Math.max(0,1-(performance.now()-t0)/time):1,
   onKey(f){addEventListener('keydown',f);cleanup.push(()=>removeEventListener('keydown',f))},
   later(f,ms){const id=setTimeout(f,ms);cleanup.push(()=>clearTimeout(id))},
   loop(f){let id;const g=t=>{if(done)return;f(t);id=requestAnimationFrame(g)};id=requestAnimationFrame(g);cleanup.push(()=>cancelAnimationFrame(id))},
   finish(score,label){if(done)return;done=true;cancelAnimationFrame(raf);cleanup.forEach(f=>f());
    const arr=Array.isArray(score)?score:[score],avg=arr.reduce((a,b)=>a+b,0)/arr.length;
    const r=ov.querySelector('.mgr');r.innerHTML=`<b>${label||(avg>=.95?'PARFAIT !':avg>=.6?'BIEN JOUÉ !':avg>0?'PAS MAL':'RATÉ…')}</b><span>${o.fmt?o.fmt(score):''}</span>`;
    r.className='mgr on '+(avg>=.6?'g':avg>0?'y':'r');sfx(avg>=.6?'mgwin':'mglose');if(avg>=.95)buzz(40);
    setTimeout(()=>{ov.classList.remove('on');ov.innerHTML='';res(score)},1250*(window.__spd||1))}};
  MGI[kind](api,o);
  setTimeout(()=>{if(done)return;started=true;t0=performance.now();ov.querySelector('.mgp').classList.add('go');
   const tick=()=>{if(done)return;const k=api.timeLeft();bar.style.transform=`scaleX(${k})`;bar.classList.toggle('low',k<.3);
    if(k<=0){const s=api.onTimeout?api.onTimeout():0;api.finish(s,api.natural?undefined:'TEMPS ÉCOULÉ');return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)},450)})}

/* ---- pièces d'échecs (même style que les joueurs) ---- */
const CPN={K:'C',Q:'PG',R:'PF',B:'SF',N:'SG'};
function chessSVG(p){const w=CHS.isW(p),t=p.toUpperCase(),f=w?'#f6efe2':'#26222e',st=w?'#3a2c1c':'#cfc6ef',hl=w?'#fff':'#5b5470';
 const head=t==='P'?'<circle cx="30" cy="30" r="12"/><rect x="21" y="40" width="18" height="5" rx="2"/>':HEADS[CPN[t]];
 const x=t==='N'?'<circle cx="31" cy="17" r="2.3" fill="'+st+'"/>':t==='B'?'<path d="M35 19 L27 30" stroke="'+st+'" stroke-width="2.4" fill="none"/>':'';
 return`<svg viewBox="0 -2 60 100"><g fill="${f}" stroke="${st}" stroke-width="2.2" stroke-linejoin="round">${head}<path d="M17 45 L43 45 L39 58 Q45 70 47 82 L52 84 L52 95 L8 95 L8 84 L13 82 Q15 70 21 58 Z"/></g>${x}<path d="M20 50 L24 50 L20 80 L17 80 Z" fill="${hl}" opacity=".35"/></svg>`}
function chessBoardHTML(b,cls){let h='<div class="cb '+(cls||'')+'">';for(let s=0;s<64;s++){const r=s>>3,c=s&7;h+=`<div class="cq ${(r+c)%2?'d':'l'}" data-s="${s}">${b[s]?chessSVG(b[s]):''}${c===0?`<em class="rk">${8-r}</em>`:''}${r===7?`<em class="fl">${'abcdefgh'[c]}</em>`:''}</div>`}return h+'</div>'}

const MGI={
 /* ---------- échecs : mat en 1 / mat en 2 ---------- */
 mate1(api){mateGame(api,1)},mate2(api){mateGame(api,2)},
 /* ---------- échecs : fourchette du cavalier ---------- */
 fork(api){const at=(r,c)=>r*8+c,inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8,KN=CHS.KNM;let b,N,sols;
  for(let k=0;k<400;k++){b=new Array(64).fill('');const nr=1+Math.floor(Math.random()*6),nc=1+Math.floor(Math.random()*6);N=at(nr,nc);b[N]='N';
   const xs=KN.map(([dr,dc])=>[nr+dr,nc+dc]).filter(([r,c])=>inb(r,c));const X=xs[Math.floor(Math.random()*xs.length)];
   const ts=KN.map(([dr,dc])=>[X[0]+dr,X[1]+dc]).filter(([r,c])=>inb(r,c)&&at(r,c)!==N);if(ts.length<2)continue;
   ts.sort(()=>Math.random()-.5);b[at(...ts[0])]='k';b[at(...ts[1])]='q';
   for(let i=0;i<3;i++){const s=Math.floor(Math.random()*64);if(!b[s]&&(s>>3)>0&&(s>>3)<7)b[s]='p'}
   for(let i=0;i<60;i++){const s=Math.floor(Math.random()*64);if(!b[s]){b[s]='K';break}}
   const atk=s=>KN.map(([dr,dc])=>[(s>>3)+dr,(s&7)+dc]).filter(([r,c])=>inb(r,c)).map(([r,c])=>at(r,c));
   if(atk(N).some(s=>b[s]==='k'||b[s]==='q'))continue;if(CHS.inCheck(b,true))continue;
   const kq=[b.indexOf('k'),b.indexOf('q')];sols=atk(N).filter(s=>b[s]!=='K'&&(!b[s]||!CHS.isW(b[s]))&&kq.every(t=>atk(s).includes(t)));if(sols.length)break}
  api.body.innerHTML=chessBoardHTML(b,'fork');const cb=api.body.querySelector('.cb');
  const dests=KN.map(([dr,dc])=>[(N>>3)+dr,(N&7)+dc]).filter(([r,c])=>inb(r,c)).map(([r,c])=>at(r,c)).filter(s=>b[s]!=='K');
  cb.querySelector(`[data-s="${N}"]`).classList.add('sel');dests.forEach(s=>cb.querySelector(`[data-s="${s}"]`).classList.add('dot'));
  cb.onclick=e=>{const q=e.target.closest('.cq');if(!q||!api.started())return;const s=+q.dataset.s;if(!dests.includes(s))return;
   const n=b.slice();n[s]='N';n[N]='';api.body.innerHTML=chessBoardHTML(n,'fork');const c2=api.body.querySelector('.cb');
   const ok=sols.includes(s);c2.querySelector(`[data-s="${s}"]`).classList.add(ok?'win':'bad');
   if(ok){[b.indexOf('k'),b.indexOf('q')].forEach(t=>c2.querySelector(`[data-s="${t}"]`).classList.add('hit'))}
   api.finish(ok?.65+.35*api.timeLeft():0,ok?'FOURCHETTE !':'RATÉ…')}},
 /* ---------- jauge de timing ---------- */
 meter(api,o){const n=o.rounds||1,out=[];let i=0,pos=0,dir=1,center=.5,w=o.zone||.24,speed=1.25,locked=false,last=performance.now();
  api.body.innerHTML=`<div class="mtk">${n>1?'<span class="mtn"></span>':''}</div><div class="mtr"><div class="mtz"><i></i></div><div class="mtc"></div></div><div class="mtf"></div><button class="mgbtn">STOP !</button>`;
  const z=api.body.querySelector('.mtz'),cur=api.body.querySelector('.mtc'),fb=api.body.querySelector('.mtf'),nn=api.body.querySelector('.mtn');
  const setup=()=>{center=.25+Math.random()*.5;w=Math.max(.12,(o.zone||.24)-i*.03);speed=1.2+i*.25+Math.random()*.2;z.style.left=(center-w/2)*100+'%';z.style.width=w*100+'%';if(nn)nn.textContent=`Lancer ${i+1}/${n}`;locked=false};
  setup();
  api.loop(t=>{const dt=Math.min(50,t-last)/1000;last=t;if(!api.started()||locked)return;pos+=dir*speed*dt;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}cur.style.left=pos*100+'%'});
  const hit=()=>{if(!api.started()||locked)return;locked=true;const d=Math.abs(pos-center);const s=d<=w/2?1-.4*(d/(w/2))*(d/(w/2)):Math.max(0,.35-(d-w/2)*3);
   out.push(+s.toFixed(2));fb.textContent=s>=.95?'💦 SWISH !':s>=.6?'✅ Dedans':s>0?'😬 Juste…':'❌ À côté';fb.className='mtf on '+(s>=.6?'g':s>0?'y':'r');sfx(s>=.6?'swish':'rim');
   i++;if(i>=n)api.later(()=>api.finish(n>1?out:out[0]),350);else api.later(()=>{fb.className='mtf';setup()},650)};
  api.body.querySelector('.mgbtn').onclick=hit;api.body.querySelector('.mtr').onclick=hit;
  api.onKey(e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hit()}});
  api.onTimeout=()=>{while(out.length<n)out.push(0);return n>1?out:out[0]}},
 /* ---------- combo de dribble ---------- */
 combo(api){const A=['←','→','↑','↓'],K={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓'},seq=Array.from({length:5},()=>A[Math.floor(Math.random()*4)]);let k=0;
  api.body.innerHTML=`<div class="cmb">${seq.map(a=>`<i>${a}</i>`).join('')}</div><div class="pad">${['↑','←','↓','→'].map(a=>`<button data-a="${a}">${a}</button>`).join('')}</div>`;
  const cells=api.body.querySelectorAll('.cmb i');
  const press=a=>{if(!api.started())return;if(a===seq[k]){cells[k].classList.add('ok');sfx('tick');k++;if(k>=seq.length)api.finish(.7+.3*api.timeLeft(),'CHEVILLES CASSÉES !')}
   else{cells[k].classList.add('ko');api.body.querySelector('.cmb').classList.add('shk');api.finish(k/seq.length*.5,'PERDU LE DRIBBLE')}};
  api.body.querySelector('.pad').onclick=e=>{const b=e.target.closest('button');if(b)press(b.dataset.a)};
  api.onKey(e=>{if(K[e.key]){e.preventDefault();press(K[e.key])}});
  api.onTimeout=()=>k/seq.length*.5},
 /* ---------- mains rapides ---------- */
 reflex(api){const n=6;let hit=0,shown=0;api.body.innerHTML=`<div class="rfx"><span class="rfc">0 / ${n}</span></div>`;const f=api.body.querySelector('.rfx'),cnt=f.querySelector('.rfc');
  const spawn=()=>{if(shown>=n)return;shown++;const b=document.createElement('button');b.className='rb';b.textContent='🏀';b.style.left=(8+Math.random()*76)+'%';b.style.top=(10+Math.random()*68)+'%';f.appendChild(b);
   let gone=false;b.onpointerdown=e=>{e.preventDefault();if(gone)return;gone=true;hit++;cnt.textContent=hit+' / '+n;b.classList.add('pop');sfx('steal');setTimeout(()=>b.remove(),250)};
   api.later(()=>{if(!gone){gone=true;b.classList.add('miss');setTimeout(()=>b.remove(),250)}},760);
   if(shown<n)api.later(spawn,720);else api.later(()=>api.finish(hit/n),900)};
  const go=()=>{if(api.started())spawn();else api.later(go,60)};go();
  api.natural=true;api.onTimeout=()=>hit/n},
 /* ---------- bras de fer ---------- */
 mash(api){let taps=0;api.body.innerHTML=`<div class="tug"><div class="tugb"><i></i></div><small><span>🤖 BOT</span><span>TOI 💪</span></small></div><button class="mgbtn big">TAPE ! TAPE !</button><div class="mshc">0</div>`;
  const bar=api.body.querySelector('.tugb i'),c=api.body.querySelector('.mshc');let t1=performance.now();
  const tap=e=>{if(e)e.preventDefault();if(!api.started())return;taps++;c.textContent=taps;sfx('tick');api.body.querySelector('.mgbtn').classList.remove('pp');void c.offsetWidth;api.body.querySelector('.mgbtn').classList.add('pp')};
  api.body.querySelector('.mgbtn').onpointerdown=tap;api.onKey(e=>{if(e.key===' '||e.key==='Enter'){tap(e)}});
  api.loop(()=>{if(!api.started())return;const el=(1-api.timeLeft())*3.5,bot=el*6,v=clamp(.5+(taps-bot)/30,0,1);bar.style.width=v*100+'%'});
  api.natural=true;api.onTimeout=()=>clamp((taps/3.5-3)/5.5,0,1)},
 /* ---------- mémoire ---------- */
 memo(api){const n=4,seq=[];while(seq.length<n){const x=Math.floor(Math.random()*9);if(!seq.includes(x))seq.push(x)}let k=0,ready=false;
  api.body.innerHTML=`<div class="mmo">${Array.from({length:9},(_,i)=>`<button data-i="${i}"></button>`).join('')}</div><div class="mtf on y">👀 Regarde…</div>`;
  const bs=api.body.querySelectorAll('.mmo button'),fb=api.body.querySelector('.mtf');
  const flash=j=>{if(j>=n){ready=true;fb.textContent='👉 À toi !';return}bs[seq[j]].classList.add('fl');sfx('tick');api.later(()=>{bs[seq[j]].classList.remove('fl');api.later(()=>flash(j+1),140)},430)};
  const go=()=>{if(api.started())flash(0);else api.later(go,60)};go();
  api.body.querySelector('.mmo').onclick=e=>{const b=e.target.closest('button');if(!b||!ready)return;const i=+b.dataset.i;
   if(i===seq[k]){b.classList.add('ok');k++;sfx('tick');if(k>=n)api.finish(.75+.25*api.timeLeft(),'VISION DE JEU !')}
   else{b.classList.add('ko');api.finish(k/n*.6,'MAUVAISE LECTURE')}};
  api.onTimeout=()=>k/n*.6}
};
function mateGame(api,depth){const list=depth===1?PZ1:PZ2;let b=CHS.fromFen(list[Math.floor(Math.random()*list.length)]);let sel=-1,moves=[],step=0;
 const draw=(mk)=>{api.body.innerHTML=chessBoardHTML(b,'mate')+`<div class="cbi">${depth===2?(step===0?'Coup 1/2 · les blancs jouent':'Coup 2/2 · mate maintenant !'):'Les blancs jouent et matent'}</div>`;
  const cb=api.body.querySelector('.cb');if(mk)mk.forEach(([s,c])=>cb.querySelector(`[data-s="${s}"]`).classList.add(c));
  if(sel>=0){cb.querySelector(`[data-s="${sel}"]`).classList.add('sel');moves.filter(m=>m.f===sel).forEach(m=>cb.querySelector(`[data-s="${m.t}"]`).classList.add(b[m.t]?'cap':'dot'))}
  const kb=b.indexOf('k');if(CHS.inCheck(b,false))cb.querySelector(`[data-s="${kb}"]`).classList.add('chk');
  cb.onclick=onTap};
 const onTap=e=>{const q=e.target.closest('.cq');if(!q||!api.started())return;const s=+q.dataset.s;
  if(sel>=0&&moves.some(m=>m.f===sel&&m.t===s)){const m={f:sel,t:s};const b0=b;b=CHS.make(b,m);sel=-1;sfx('move');
   if(CHS.isMate(b,false)){draw([[m.f,'from'],[m.t,'to']]);api.body.querySelector('.cb').classList.add('mated');api.finish(.7+.3*api.timeLeft(),'ÉCHEC ET MAT !');return}
   if(depth===2&&step===0&&CHS.isMate2Move(b0,m)){step=1;moves=[];draw([[m.f,'from'],[m.t,'to']]);
    api.later(()=>{const rs=CHS.legal(b,false);const r=rs[Math.floor(Math.random()*rs.length)];b=CHS.make(b,r);moves=CHS.legal(b,true);sfx('move');draw([[r.f,'from'],[r.t,'to']])},550);return}
   draw([[m.f,'from'],[m.t,'bad']]);api.finish(0,CHS.inCheck(b,false)?'ÉCHEC… MAIS PAS MAT':'PAS DE MAT');return}
  if(b[s]&&CHS.isW(b[s])&&moves.some(m=>m.f===s)){sel=s;sfx('tick')}else sel=-1;draw()};
 moves=CHS.legal(b,true);draw()}
